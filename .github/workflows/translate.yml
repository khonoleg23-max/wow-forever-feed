name: Translate WoW Forever feed

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      test_channel:
        description: "Проверка: заново отправить свежую статью в канал"
        type: choice
        options: ["", guides, professions, addons]
        default: ""

permissions:
  contents: write

concurrency:
  group: translate-feed
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Anthropic SDK
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: pip install --quiet anthropic

      - name: Translate feed
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISCORD_WEBHOOK_GUIDES: ${{ secrets.DISCORD_WEBHOOK_GUIDES }}
          DISCORD_WEBHOOK_PROFESSIONS: ${{ secrets.DISCORD_WEBHOOK_PROFESSIONS }}
          DISCORD_WEBHOOK_ADDONS: ${{ secrets.DISCORD_WEBHOOK_ADDONS }}
          TEST_CHANNEL: ${{ inputs.test_channel }}
        run: python translate_feed.py

      - name: Commit updated feeds
        run: |
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update translated feeds"
            git push
          fi
